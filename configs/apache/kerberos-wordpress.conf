# Apache GSSAPI / Kerberos config for WordPress
# Place in /etc/httpd/conf.d/ or sites-enabled

<Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted

    AuthType GSSAPI
    AuthName "Kerberos SSO - LiveWire Portal"
    GssapiCredStore keytab:/etc/krb5.keytab
    GssapiLocalName On
    GssapiAllowedMech krb5
    GssapiBasicAuth On
    Require valid-user
</Directory>

# Fallback for non-Kerberos clients (MFA or password)
<Location /wp-login.php>
    AuthType GSSAPI
    AuthName "Kerberos SSO"
    GssapiCredStore keytab:/etc/krb5.keytab
    GssapiLocalName On
    Require valid-user
    # Or use basic auth fallback
</Location>