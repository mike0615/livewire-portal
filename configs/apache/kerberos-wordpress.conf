# Apache GSSAPI / Kerberos config for WordPress
# Place in /etc/httpd/conf.d/ or sites-enabled
# Hardened per go-live checklist: pure GSSAPI, no basic-auth fallback.

<Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted

    AuthType GSSAPI
    AuthName "Kerberos SSO - LiveWire Portal"
    GssapiCredStore keytab:/etc/krb5.keytab
    GssapiLocalName On
    GssapiAllowedMech krb5
    GssapiSSLonly On
    GssapiNegotiateOnce On
    Require valid-user
</Directory>

# wp-login.php uses the same hardened GSSAPI block (no password fallback).
<Location /wp-login.php>
    AuthType GSSAPI
    AuthName "Kerberos SSO"
    GssapiCredStore keytab:/etc/krb5.keytab
    GssapiLocalName On
    GssapiSSLonly On
    GssapiNegotiateOnce On
    Require valid-user
</Location>